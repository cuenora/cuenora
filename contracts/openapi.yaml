        "503":
          $ref: "#/components/responses/CategoryListingError"

  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List the authenticated owner's accounts and current balances
      description: >-
        Requires a current verified email and active bearer session. Only the
        authenticated owner's accounts are returned; no profile time zone is
        required. Active and archived accounts are included without an archive
        filter or mutation. Names are returned exactly as stored. Each item has
        id, name, account_type, currency, status and balance. Balance is the exact
        sum of all signed account movements, including compensations regardless
        of current event state, in the account currency. No movements means 0.00;
        negative balances are valid. No history filter or cross-account total is
        provided. Unrepresentable totals fail the page safely with 503; posting
        data is not exposed. JSON response is no-store. Query fields are
        strict, unique and limited to 1024 UTF-8 bytes; GET bodies must be empty
        and are limited to 8192 bytes. Pages order by created_at ascending and
        id ascending. The opaque cursor is the last returned account UUID and is
        resolved only among the authenticated owner's accounts. A page uses one
        repeatable-read, read-only database snapshot; cursor/page failures never
        become an empty success response.
      security:
        - AccessBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          description: Results per page; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          required: false
          description: Opaque cursor from next_cursor; must identify an owned account.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One bounded owner-scoped account page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListing"
              example:
                accounts:
                  - id: 00000000-0000-0000-0000-000000000001
                    name: Daily
                    account_type: normal
                    currency: SEK
                    status: active
                    balance: "123.45"
                next_cursor: null
        "400":
          $ref: "#/components/responses/AccountListingError"
        "401":
          description: Missing, invalid, expired or revoked bearer; no data is returned.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/AccountListingError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/AccountListingError"
        "503":
          $ref: "#/components/responses/AccountListingError"
    post:
      operationId: createAccount
      summary: Create an owned account exactly once per idempotency key
      description: >-
        Requires verified email and an active bearer. Omit opening_balance for the
        existing metadata-only operation without a zone requirement. An explicit
        opening object requires a confirmed supported IANA profile zone and an
        explicit nonfuture business date. A nonzero amount creates a special
        opening_balance event, signed movement and minimal audit atomically
        with the account and key; zero creates no financial posting.
        JSON is limited to 8192 bytes; unknown and duplicate fields are rejected.
        Name uses domain Unicode outer trimming, 1–255 scalar values and no ASCII controls.
        Keys are scoped to the authenticated owner and account creation, retained
        for the account lifetime with no expiry. Same normalized name/type/currency
        and optional opening minor amount/date replay the original 201 result;
        changed content conflicts without writes. Existing no-opening keys remain
        valid. Replay does not repost or revalidate a previously accepted date
        after a profile-zone change.
        Retry uncertain responses with the same key. Verification email/confirmation
        runtime remains pending; there is no financial authorization bypass.
      security:
        - AccessBearer: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Case-sensitive unique key per intended creation; exactly one header value.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, account_type, currency]
              properties:
                name:
                  type: string
                  description: Normalized length must be 1–255 Unicode scalar values.
                account_type:
                  type: string
                  enum: [normal, savings]
                currency:
                  type: string
                  enum: [SEK, EUR, USD]
                opening_balance:
                  type: object
                  additionalProperties: false
                  required: [amount, occurred_on]
                  description: Optional explicit opening instruction, never null; zero still validates its declared date/zone but creates no event/movement/audit.
                  properties:
                    amount:
                      type: string
                      pattern: '^-?[0-9]+(\.[0-9]{1,2})?$'
                      description: Exact signed Money minor-unit bounds; account currency applies, no rounding.
                      example: "1250.00"
                    occurred_on:
                      type: string
                      format: date
                      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                      description: Gregorian 0001-01-01 through 9999-12-31; no later than today in confirmed profile zone.
                      example: "2026-10-01"
            example: {name: Daily, account_type: normal, currency: SEK}
      responses:
        "201":
          description: Created account or original creation result replayed, even after later metadata changes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name, account_type, currency, status]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string, minLength: 1, maxLength: 255}
                  account_type: {type: string, enum: [normal, savings]}
                  currency: {type: string, enum: [SEK, EUR, USD]}
                  status: {type: string, const: active}
        "400":
          $ref: "#/components/responses/AccountCreationError"
        "401":
          description: Missing, invalid, expired or revoked bearer; no writes.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/AccountCreationError"
        "409":
          $ref: "#/components/responses/AccountCreationError"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AccountCreationError"

  /v1/accounts/{id}:
    patch:
      operationId: updateAccount
      summary: Rename, archive or reactivate an owned account
      description: >-
        Requires current verified email and an active bearer. Only name/status
        may change; profile time zone is unnecessary. Strict unique JSON fields,
        no explicit null or query parameters, at least one field, 8192-byte body.
        Names use the existing Unicode trim/scalar/control policy; duplicates
        remain allowed, including archived-account names. An active-to-archived
        transition requires an exact zero signed posting sum, including
        compensations regardless of event state. Nonzero totals reject the whole
        request without a partial rename. Owner then account locks serialize the
        READ COMMITTED sum/state update. Same assignments do not change timestamps.
        Archived history/balance remain queryable; reactivation enables future
        postings without changing history. Future income/expense/transfer routes
        must lock in the same order and reject archived accounts before posting;
        historical-correction policy remains separate. No deletion, balance,
        type, currency or owner update. Original creation-key replay is unchanged.
        Concurrent same-field assignments are last-writer-wins; this is not
        lifetime Idempotency-Key replay. Commit acknowledgement may be uncertain;
        retry the assignment only with awareness of intervening edits.
      security:
        - AccessBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
          description: Owned account UUID; uppercase hex is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                status: {type: string, enum: [active, archived]}
            example: {name: Daily expenses, status: archived}
      responses:
        "200":
          description: Current five-field account metadata; no financial changes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMetadata"
        "400":
          $ref: "#/components/responses/AccountManagementError"
        "401":
          description: Missing, invalid, expired or revoked bearer; no writes.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/AccountManagementError"
        "404":
          $ref: "#/components/responses/AccountManagementError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AccountManagementError"
        "413":
          $ref: "#/components/responses/AccountManagementError"
        "415":
          $ref: "#/components/responses/AccountManagementError"
        "503":
          $ref: "#/components/responses/AccountManagementError"

  /v1/transactions/{id}:
    patch:
      operationId: editTransaction
      summary: Correct an owned recorded event without rewriting postings
      description: >-
        Supports all five recorded kinds; kind and creation instant are immutable.
        Omitted fields retain latest locked values. Movement changes append linked
        inverses on original dates and replacements on the edited date, atomically
        with minimal changed-field audit and a permanent mutation retry key.
        All affected old/new accounts must be active; metadata-only edits may
        reference archived accounts. Ordinary income cannot target savings.
        Explicit dates require a confirmed profile zone and cannot be future;
        unrelated edits do not revalidate historical dates. Keys bind owner,
        target, action and normalized supplied fields; matching retries return
        the original acknowledgement without overwriting intervening edits.
        Voided events cannot be edited or restored. No-op assignments do not
        update event timestamps, audit or postings. No query parameters allowed.
        Distinct keys serialize using latest state, without optimistic versioning.
      security:
        - AccessBearer: []
      parameters:
        - $ref: "#/components/parameters/MutationTransactionId"
        - $ref: "#/components/parameters/MutationKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPatch"
            example: {amount: "125.50", description: "Corrected receipt"}
      responses:
        "200":
          $ref: "#/components/responses/TransactionMutationAcknowledgement"
        "400":
          $ref: "#/components/responses/TransactionMutationError"
        "401":
          $ref: "#/components/responses/TransactionMutationError"
        "403":
          $ref: "#/components/responses/TransactionMutationError"
        "404":
          $ref: "#/components/responses/TransactionMutationError"
        "409":
          $ref: "#/components/responses/TransactionMutationError"
        "413":
          $ref: "#/components/responses/TransactionMutationError"
        "415":
          $ref: "#/components/responses/TransactionMutationError"
        "503":
          $ref: "#/components/responses/TransactionMutationError"
  /v1/transactions/{id}/void:
    post:
      operationId: voidTransaction
      summary: Void an owned recorded event with atomic inverse postings
      description: >-
        Requires verified email and the same permanent mutation-key rules as edit.
        Accepts exactly an empty JSON object, no queries. Appends linked inverses
        on original economic dates without deleting history. Both transfer legs,
        event state, minimal audit and key commit together. All affected accounts
        must be active; reactivate archived accounts first. Already-voided events
        are successful no-ops without additional audit or balance effects. A
        matching key replays the original acknowledgement. Does not revalidate
        historic dates or require a profile zone. Restore is not supported.
      security:
        - AccessBearer: []
      parameters:
        - $ref: "#/components/parameters/MutationTransactionId"
        - $ref: "#/components/parameters/MutationKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
      responses:
        "200":
          $ref: "#/components/responses/TransactionMutationAcknowledgement"
        "400":
          $ref: "#/components/responses/TransactionMutationError"
        "401":
          $ref: "#/components/responses/TransactionMutationError"
        "403":
          $ref: "#/components/responses/TransactionMutationError"
        "404":
          $ref: "#/components/responses/TransactionMutationError"
        "409":
          $ref: "#/components/responses/TransactionMutationError"
        "413":
          $ref: "#/components/responses/TransactionMutationError"
        "415":
          $ref: "#/components/responses/TransactionMutationError"
        "503":
          $ref: "#/components/responses/TransactionMutationError"
  /v1/recurring-occurrences/{id}/skip:
    post:
      operationId: skipRecurringOccurrence
      summary: Skip a planned recurring occurrence
      description: >-
        Verified owner only. Planning changes never post an expense, movement or audit.
        Only planned occurrences accept new actions, including paused/ended rules
        and archived planned accounts. No confirmed profile zone is needed.
        Only state and updated_at change; reopening is unsupported.
        Original slot, planned terms and rule anchor remain unchanged.
        Permanent owner-wide action keys share a namespace across skip/postpone,
        separate from confirmation and rules. Matching retries replay the original
        200 result even after later actions, without undoing them. Changed intent
        or target conflicts. Foreign/missing targets return 404 before retry lookup.
        No query parameters or unknown/duplicate fields; JSON limit 8192 bytes.
      security:
        - AccessBearer: []
      parameters:
        - $ref: "#/components/parameters/MutationTransactionId"
        - $ref: "#/components/parameters/MutationKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceSkipInput"
            example: {}
      responses:
        "200":
          description: Original planning action result, including on matching retry; not a current-state read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceActionResult"
        "400":
          $ref: "#/components/responses/OccurrenceActionError"
        "401":
          $ref: "#/components/responses/OccurrenceActionError"
        "403":
          $ref: "#/components/responses/OccurrenceActionError"
        "404":
          $ref: "#/components/responses/OccurrenceActionError"
        "409":
