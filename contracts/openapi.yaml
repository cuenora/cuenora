      responses:
        "200":
          description: Complete global catalog; never a partial response.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, code, kind, name]
                      properties:
                        id: {type: string, format: uuid}
                        code: {type: string, pattern: '^[a-z]+(_[a-z]+)*$'}
                        kind: {type: string, enum: [income, expense]}
                        name: {type: string}
        "400":
          $ref: "#/components/responses/CategoryListingError"
        "401":
          description: Missing, invalid, expired or revoked bearer; invalid_access_token.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
