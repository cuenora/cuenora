openapi: 3.1.0
info:
  title: Cuenora API
  version: 0.1.0
  description: >-
    Versioned local API with liveness, registration, login, refresh, logout and verified-owner account creation. All paths use /v1 without legacy aliases.
    Errors have code, message, details (null) and request_id. Success payloads
    are unchanged. Authentication POST routes apply process-local fixed 60-second
    limits: registration 5/client IP, login 20/client IP and 10/canonical email
    across IPs, refresh and logout 60/client IP each, logout-all 20/client IP
    and 10/authenticated user across IPs. IPv6 clients share a /64 bucket. All attempts
    count; IP protection runs before payload validation. Exhaustion returns 429
    with Retry-After. Missing/untrusted client identity or unavailable bounded
    protection state returns 503 protection_unavailable. See ADR-020 for exact
    trusted-proxy configuration and deployment prerequisites. X-Request-ID is server-generated on every application response
    except 503 request_id_unavailable, whose request_id is null and header absent.
    Unmatched paths use components.responses.NotFound; unsupported methods use
    components.responses.MethodNotAllowed. HTTP parse failures before Axum,
    disconnects and panics are outside this contract. Error-envelope replacement
    is intentional; clients must read code instead of the former error field.
servers:
  - url: http://127.0.0.1:3000
paths:
  /v1/accounts/{id}/savings-terms:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listSavingsTermsHistory
      summary: List savings-account interest terms history
      security: [{AccessBearer: []}]
      description: >-
        Requires current verified email and an owned savings account (active or archived).
        Ascending inclusive-effective-date versions; no inferred terms or financial effects.
        Unknown/duplicate query parameters and nonempty bodies are rejected.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          description: Exclusive effective_on date from next_cursor. Query length is at most 1024 bytes.
          schema: {type: string, format: date}
      responses:
        "200":
          description: Bounded history, including historical and future versions.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [versions, next_cursor]
                properties:
                  versions:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/SavingsTermsVersion"}
                  next_cursor: {type: [string, "null"], format: date}
        default:
          $ref: "#/components/responses/SavingsConfigurationError"
    post:
      operationId: appendSavingsTerms
      summary: Append effective-dated savings-account interest terms
      security: [{AccessBearer: []}]
      description: >-
        Requires current verified email and an owned savings account (active or archived).
        Natural identity is account + stream + effective_on: an identical retry returns
        the original version and 201; different values at the same date return 409
        savings_configuration_conflict. Rates compare numerically (2 and 2.0 replay).
        No Idempotency-Key is required. Queries are rejected. JSON body limit 8192 bytes.
        Versions cannot be edited or deleted, including future versions. No money is posted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavingsTermsInput"}
      responses:
        "201":
          description: Created version or identical original-version acknowledgement on retry.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavingsTermsVersion"}
        default:
          $ref: "#/components/responses/SavingsConfigurationError"
  /v1/accounts/{id}/savings-rates:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listSavingsRateHistory
      summary: List savings-account nominal annual rates history
      security: [{AccessBearer: []}]
      description: >-
        Requires current verified email and an owned savings account (active or archived).
        Ascending inclusive-effective-date versions; no inferred terms or financial effects.
        Unknown/duplicate query parameters and nonempty bodies are rejected.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: cursor
          in: query
          description: Exclusive effective_on date from next_cursor. Query length is at most 1024 bytes.
          schema: {type: string, format: date}
      responses:
        "200":
          description: Bounded history, including historical and future versions.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [versions, next_cursor]
                properties:
                  versions:
                    type: array
                    maxItems: 100
                    items: {$ref: "#/components/schemas/SavingsRateVersion"}
                  next_cursor: {type: [string, "null"], format: date}
        default:
          $ref: "#/components/responses/SavingsConfigurationError"
    post:
      operationId: appendSavingsRate
      summary: Append effective-dated savings-account nominal annual rates
      security: [{AccessBearer: []}]
      description: >-
        Requires current verified email and an owned savings account (active or archived).
        Natural identity is account + stream + effective_on: an identical retry returns
        the original version and 201; different values at the same date return 409
        savings_configuration_conflict. Rates compare numerically (2 and 2.0 replay).
        No Idempotency-Key is required. Queries are rejected. JSON body limit 8192 bytes.
        Versions cannot be edited or deleted, including future versions. No money is posted.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SavingsRateInput"}
      responses:
        "201":
          description: Created version or identical original-version acknowledgement on retry.
          headers:
            X-Request-ID: {$ref: "#/components/headers/RequestId"}
            Cache-Control: {$ref: "#/components/headers/NoStore"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SavingsRateVersion"}
        default:
          $ref: "#/components/responses/SavingsConfigurationError"
  /v1/health/live:
    get:
      operationId: healthLive
      summary: Check process liveness
      description: Returns a static response without checking database readiness.
      responses:
        "200":
          description: The HTTP process is responding.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                const: OK
              example: OK
        "503":
          description: Request ID generation is unavailable; no database check is involved.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a pending identity
      description: >-
        Accepts only email and password in at most 8192 bytes of JSON. Email uses
        an ASCII local part and IDNA domain; comparison is case-insensitive, but
        dots and plus tags remain significant. Passwords contain 15–128 Unicode
        scalar values, allow spaces, and must pass offline common-password
        screening. Hashing preserves exact UTF-8 bytes. Valid new and duplicate
        registrations return the same response without replacing credentials.
        Creates no session or financial authority; does not send verification mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Original input; up to 1024 UTF-8 bytes and 254 bytes after IDNA conversion.
                  example: synthetic+tag@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 15
                  maxLength: 128
                  example: violet hills beside summer rivers
      responses:
        "202":
          description: Accepted without disclosing whether an identity already exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
              example: {status: accepted}
        "400":
          description: Malformed JSON, unknown/duplicate fields, or rejected email/password policy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Registration unavailable, including missing database configuration or full admission capacity. Retry later; no database details are disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/RegistrationUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate and issue an opaque session
      description: >-
        Accepts email and exact password bytes in at most 8192 bytes of JSON.
        Password verification accepts existing passwords up to 128 Unicode
        scalar values and 512 UTF-8 bytes without registration's signup policy.
        Unknown identities and incorrect passwords share the same response.
        Pending users may log in, but this response grants no financial access.
        The server stores only access and refresh token digests. Tokens are
        returned once and must be treated as opaque. Refresh rotation is available
        through POST /v1/auth/refresh. Route-scoped bearer identity middleware is
        implemented; account creation separately enforces verified-email ownership.
        Other financial endpoints and posting authorization remain pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Original input; ASCII local part with IDNA domain.
                  example: synthetic+tag@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 128
                  example: violet hills beside summer rivers
      responses:
        "200":
          description: Credentials verified and a new session/token family was persisted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
                properties:
                  access_token:
                    type: string
                    readOnly: true
                  refresh_token:
                    type: string
                    readOnly: true
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    const: 900
                  refresh_expires_in:
                    type: integer
                    const: 2592000
              example:
                access_token: ca1_<opaque>
                refresh_token: cr1_<opaque>
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
        "400":
          description: Malformed JSON, unknown/duplicate fields, invalid email or overlong password.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "401":
          description: Email or password does not match a usable credential.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentials"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Verification, storage, entropy or shared admission is unavailable. No details are disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/LoginUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a one-time refresh credential
      description: >-
        Accepts only refresh_token in at most 8192 bytes of JSON. A successful
        rotation consumes the credential and returns fresh opaque access and
        refresh secrets for the same session. Access lasts 15 minutes; refresh
        validity restarts at 30 days, without an absolute session-age cap.
        Ordinary API activity alone does not extend the refresh deadline.
        Reuse of any consumed generation revokes its whole session family,
        including an expired consumed generation. Other sessions are unaffected.
        Concurrent refreshes or retry after a lost successful response can force
        fresh login. Clients must serialize refresh and replace both secrets
        together. Existing access rows remain, but eventual access validation
        must reject revoked families. No cookies, financial authority or bearer
        middleware are provided. All responses use Cache-Control no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
                  description: Complete opaque refresh credential received at login or last rotation.
                  example: cr1_<opaque>
      responses:
        "200":
          description: The credential was consumed and a new pair persisted atomically.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
              example:
                access_token: ca1_<opaque>
                refresh_token: cr1_<opaque>
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
        "400":
          description: Malformed JSON, missing/wrong-type refresh_token, or unknown/duplicate fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "401":
          description: Malformed, unknown, expired, revoked or consumed refresh credential. Consumed-token reuse commits family revocation before rejection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRefreshToken"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Missing database configuration, storage/entropy failure or full refresh capacity. A lost commit response can be ambiguous; retrying a consumed predecessor may revoke its family.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/RefreshUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke the family identified by a retained refresh credential
      description: >-
        Strict JSON up to 8192 bytes. Access is not required. Any retained refresh
        generation, including consumed/expired, can revoke its own family.
        Unknown/malformed secrets and already revoked families have the same
        empty 204 response. Revocation timestamps and token history are retained.
        Other sessions/users are unaffected. All responses are no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "204":
          $ref: "#/components/responses/LogoutSuccess"
        "400":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      summary: Reauthenticate and revoke every session of the authenticated user
      description: >-
        Requires a valid access bearer and the current exact-byte password.
        Strict JSON up to 8192 bytes; password up to 128 Unicode scalars/512 UTF-8
        bytes. User/session IDs are derived only from the bearer, never caller
        owner hints. Revokes the authorizing session too. Shares the credential
        row lock with login: earlier logins are included, later logins may create
        fresh sessions. Family locks serialize refresh/logout. Existing handlers
        already admitted by middleware are not cancelled. No credentials or
        token history are deleted. Repeat after success requires a fresh login.
        All responses are no-store. A lost commit response can be ambiguous.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 128
      responses:
        "204":
          $ref: "#/components/responses/LogoutSuccess"
        "400":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "401":
          description: Invalid/missing access bearer, wrong/stale password or newly revoked authorizing family. No submitted values disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            WWW-Authenticate:
              description: Present for bearer rejection only; Bearer when missing, otherwise Bearer error="invalid_token".
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidAccessToken"
                  - $ref: "#/components/schemas/InvalidCredentials"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /v1/me:
    patch:
      operationId: confirmProfileTimeZone
      summary: Explicitly confirm or update the authenticated profile IANA zone
      description: >-
        Accepts only time_zone in at most 8192 bytes of strict JSON. No unknown or
        duplicate fields. Pending-email identities may configure their profile;
        this grants no financial authority. Preserve the exact supported named
        identifier or alias; reject numeric offsets, whitespace and unknown names.
        Same-value retry leaves updated_at unchanged. No GET or other profile
        mutations are implemented. The owner comes only from bearer identity.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [time_zone]
              properties:
                time_zone:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Exact supported IANA identifier or recognized alias from the compiled chrono-tz catalog.
                  example: Europe/Stockholm
      responses:
        "200":
          description: Zone explicitly confirmed; no other profile field returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [time_zone]
                properties:
                  time_zone: {type: string}
              example: {time_zone: Europe/Stockholm}
        "400":
          $ref: "#/components/responses/ProfileZoneError"
        "401":
          description: Missing, invalid, expired or revoked bearer, no profile write.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/ProfileZoneError"
        "415":
          $ref: "#/components/responses/ProfileZoneError"
        "503":
          $ref: "#/components/responses/ProfileZoneError"

  /v1/transactions:
    get:
      operationId: listTransactions
      summary: List the verified owner's recorded financial history
      description: >-
        Owner-scoped income, expense, transfer, opening_balance and interest_income,
        including posted/voided events, accountless entries and archived-account
        history; never planned occurrences or aggregated balances. Requires verified
        email, not a profile zone. Sort by occurred_on descending then UUID descending.
        Filters combine with AND. Dates are inclusive stored business dates, not audit
        instants. Default 50/max100 rows, exclusive last-event UUID cursor; keep filters
        unchanged. Each request uses one read-only repeatable-read snapshot, not a
        frozen cross-request export. A cursor must identify an owned filter-matching
        event. Unknown/foreign accounts/cursors have indistinguishable generic 400
        errors. Reject unknown/duplicate keys, invalid/reversed dates, nonempty GET
        bodies and raw queries over 1024 bytes. Reads change no financial state.
      security:
        - AccessBearer: []
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: cursor
          description: Opaque next_cursor UUID from the preceding page.
          schema: {type: string, format: uuid}
        - in: query
          name: date_from
          description: Inclusive earliest business date, strict YYYY-MM-DD, years 0001–9999.
          schema: {type: string, format: date}
        - in: query
          name: date_to
          description: Inclusive latest business date; cannot precede date_from.
          schema: {type: string, format: date}
        - in: query
          name: category_id
          description: Existing global built-in category UUID.
          schema: {type: string, format: uuid}
        - in: query
          name: account_id
          description: Owned account UUID (either transfer side) or literal none for accountless events.
          schema:
            oneOf:
              - {type: string, format: uuid}
              - {type: string, enum: [none]}
      responses:
        "200":
          description: Bounded financial-event page; no totals or balance calculations.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListing"
              example:
                transactions:
                  - id: "00000000-0000-0000-0000-000000000001"
                    kind: expense
                    state: posted
                    amount: "12.34"
                    currency: SEK
                    occurred_on: "2024-02-29"
                    account_id: null
                    category_id: null
                    description: null
                    destination_account_id: null
                    received_amount: null
                    received_currency: null
                next_cursor: null
        "400":
          $ref: "#/components/responses/TransactionListingError"
        "401":
          description: Missing, invalid, expired or revoked bearer.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/TransactionListingError"
        "413":
          $ref: "#/components/responses/TransactionListingError"
        "503":
          $ref: "#/components/responses/TransactionListingError"
    post:
      operationId: createAccountlessIncome
      summary: Record realized income, expense or a transfer
      description: >-
        Strict JSON up to 8192 bytes, no unknown/duplicate fields or nonempty query.
        Requires verified email and a confirmed IANA profile zone. occurred_on is
        explicit, strict YYYY-MM-DD, year 0001–9999 and past/today in that zone.
        Positive exact decimal-string money only; no implicit account. An optional
        account UUID must identify an owned active account in the same currency.
        Income requires a normal account; expenses allow normal and savings accounts.
        Transfers require account_id and destination_account_id for distinct owned active
        normal/savings accounts, amount/currency for the source and received_amount/received_currency
        for the destination. Both amounts are positive; same-currency amounts must be equal.
        They create one source debit and one destination credit in the same SQL transaction
        as the event, audit and retry record. No insufficient-balance rejection applies.
        Optional quoted_rate is a positive exact decimal string with at most twelve fractional
        digits, in destination units per source unit. Null/absence records no quote.
        Checked half-even indicative amounts are informational; actual amounts determine postings.
        Quoted acknowledgements include canonical quoted_rate and rate_comparison; no-quote
        acknowledgements retain their original shape. Invalid/overflowing quotes return 400.
        The alias rate and all unknown fields reject.
        Transfer-only fields remain invalid on income/expense requests.
        Omitted/null account creates no movements; linked income adds one positive
        movement and linked expense one negative movement. Negative balances are allowed.
        Unknown/foreign accounts return generic 404; archived, wrong-currency or
        income-to-savings requests return 400 invalid_request.
        Category is optional and must match the event kind. Creates one
        posted event, optional movement, minimal create audit and permanent owner-scoped retry record
        atomically. Equivalent retries return the original 201 response even if the
        event/profile/account changes later; bearer and current verification still apply.
        Account UUID hex case normalizes to lowercase. Accepted retries do not
        revalidate account state or post again.
        Money syntax and optional null/absence normalize; description is exact.
        Reusing a key for different input returns 409. No key expires. A lost commit
        response can be ambiguous; retry the same key. Creation replay preserves the
        original acknowledgement after later edits or voiding; it never reposts.
      security:
        - AccessBearer: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Exactly one header; permanent owner/operation-scoped retry key, independent for income, expense and transfer and not shared with account creation.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AccountlessIncomeInput"
                - $ref: "#/components/schemas/AccountlessExpenseInput"
                - $ref: "#/components/schemas/TransferInput"
            example: {kind: income, amount: "300.00", currency: SEK, occurred_on: "2024-02-29", account_id: null}
      responses:
        "201":
          description: One income/expense or two-legged transfer recorded, or original creation replayed without writes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreatedAccountlessIncome"
                  - $ref: "#/components/schemas/CreatedAccountlessExpense"
                  - $ref: "#/components/schemas/CreatedTransfer"
        "400":
          $ref: "#/components/responses/IncomeCreationError"
        "401":
          description: Missing, invalid, expired or revoked bearer. No financial writes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/IncomeCreationError"
        "404":
          $ref: "#/components/responses/IncomeCreationError"
        "409":
          $ref: "#/components/responses/IncomeCreationError"
        "413":
          $ref: "#/components/responses/IncomeCreationError"
        "415":
          $ref: "#/components/responses/IncomeCreationError"
        "503":
          $ref: "#/components/responses/IncomeCreationError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /v1/categories:
    get:
      operationId: listCategories
      summary: List the global read-only built-in category catalog
      description: >-
        Requires a valid bearer session, but not verified email or a confirmed
        profile zone. Returns the same ten built-ins for every user, ordered by
        UUID ascending. No query parameters, request body, pagination or category
        mutations are supported. HEAD follows GET without a response body.
        Category access grants no financial authority.
      security:
        - AccessBearer: []
      responses:
        "200":
          description: Complete global catalog; never a partial response.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [categories]
                properties:
                  categories:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, code, kind, name]
                      properties:
                        id: {type: string, format: uuid}
                        code: {type: string, pattern: '^[a-z]+(_[a-z]+)*$'}
                        kind: {type: string, enum: [income, expense]}
                        name: {type: string}
        "400":
          $ref: "#/components/responses/CategoryListingError"
        "401":
          description: Missing, invalid, expired or revoked bearer; invalid_access_token.
          headers:
            WWW-Authenticate:
