  /v1/recurring-occurrences/{id}/confirm:
    post:
      operationId: confirmRecurringOccurrence
      summary: Record the actual payment of a planned occurrence
      description: >-
        Verified owner only. Explicit actual amount, currency and occurred_on;
        optional account/category/description default to null, never planned terms.
        Existing expense posting guards apply, including confirmed profile zone,
        nonfuture date and owned active currency-compatible account.
        A paused/ended rule does not block its existing planned occurrences.
        Atomically create the expense, optional movement, audit, link and retry.
        Permanent owner-wide confirmation key namespace, independent of ordinary
        expenses. Matching normalized retries return the original 201 response
        even after expense edits/voids, account archive or profile-zone changes.
        Different intent/occurrence with the same key conflicts; a new operation
        on a confirmed/skipped occurrence conflicts. Planned snapshots stay fixed.
        No query parameters or unknown/duplicate fields; maximum JSON body 8192 bytes.
      security:
        - AccessBearer: []
      parameters:
        - name: id
          in: path
