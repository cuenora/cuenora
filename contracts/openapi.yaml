      required: [amount, currency, cadence, starts_on, time_zone]
      properties:
        amount: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
        currency: {type: string, enum: [SEK, EUR, USD]}
        account_id: {type: [string, "null"], format: uuid}
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 1000}
        cadence: {type: string, enum: [weekly, monthly, quarterly, annual]}
        starts_on: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        ends_on: {type: [string, "null"], format: date, description: Inclusive; must not precede starts_on.}
        time_zone: {type: string, minLength: 1, maxLength: 255}
    RecurringRulePatch:
      type: object
      additionalProperties: false
      description: Exact positive amount up to 92233720368547758.07; no control characters in description; explicit supported IANA zone. Dates use years 0001–9999.
      minProperties: 1
      properties:
        amount: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
