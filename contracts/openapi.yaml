openapi: 3.1.0
info:
  title: Cuenora API
  version: 0.1.0
  description: >-
    Local API with liveness, registration, login, refresh and logout; no financial routes.
    Errors have code, message, details (null) and request_id. Success payloads
    are unchanged. Authentication POST routes apply process-local fixed 60-second
    limits: registration 5/client IP, login 20/client IP and 10/canonical email
    across IPs, refresh and logout 60/client IP each, logout-all 20/client IP
    and 10/authenticated user across IPs. IPv6 clients share a /64 bucket. All attempts
    count; IP protection runs before payload validation. Exhaustion returns 429
    with Retry-After. Missing/untrusted client identity or unavailable bounded
    protection state returns 503 protection_unavailable. See ADR-020 for exact
    trusted-proxy configuration and deployment prerequisites. X-Request-ID is server-generated on every application response
    except 503 request_id_unavailable, whose request_id is null and header absent.
    Unmatched paths use components.responses.NotFound; unsupported methods use
    components.responses.MethodNotAllowed. HTTP parse failures before Axum,
    disconnects and panics are outside this contract. Error-envelope replacement
    is intentional; clients must read code instead of the former error field.
servers:
  - url: http://127.0.0.1:3000
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Check process liveness
      description: Returns a static response without checking database readiness.
      responses:
        "200":
          description: The HTTP process is responding.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                const: OK
              example: OK
        "503":
          description: Request ID generation is unavailable; no database check is involved.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/register:
    post:
      operationId: registerUser
      summary: Register a pending identity
      description: >-
        Accepts only email and password in at most 8192 bytes of JSON. Email uses
        an ASCII local part and IDNA domain; comparison is case-insensitive, but
        dots and plus tags remain significant. Passwords contain 15–128 Unicode
        scalar values, allow spaces, and must pass offline common-password
        screening. Hashing preserves exact UTF-8 bytes. Valid new and duplicate
        registrations return the same response without replacing credentials.
        Creates no session or financial authority; does not send verification mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Original input; up to 1024 UTF-8 bytes and 254 bytes after IDNA conversion.
                  example: synthetic+tag@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 15
                  maxLength: 128
                  example: violet hills beside summer rivers
      responses:
        "202":
          description: Accepted without disclosing whether an identity already exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
              example: {status: accepted}
        "400":
          description: Malformed JSON, unknown/duplicate fields, or rejected email/password policy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Registration unavailable, including missing database configuration or full admission capacity. Retry later; no database details are disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/RegistrationUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/login:
    post:
      operationId: loginUser
      summary: Authenticate and issue an opaque session
      description: >-
        Accepts email and exact password bytes in at most 8192 bytes of JSON.
        Password verification accepts existing passwords up to 128 Unicode
        scalar values and 512 UTF-8 bytes without registration's signup policy.
        Unknown identities and incorrect passwords share the same response.
        Pending users may log in, but this response grants no financial access.
        The server stores only access and refresh token digests. Tokens are
        returned once and must be treated as opaque. Refresh rotation is available
        through POST /auth/refresh; bearer authentication remains pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Original input; ASCII local part with IDNA domain.
                  example: synthetic+tag@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 128
                  example: violet hills beside summer rivers
      responses:
        "200":
          description: Credentials verified and a new session/token family was persisted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
                properties:
                  access_token:
                    type: string
                    readOnly: true
                  refresh_token:
                    type: string
                    readOnly: true
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    const: 900
                  refresh_expires_in:
                    type: integer
                    const: 2592000
              example:
                access_token: ca1_<opaque>
                refresh_token: cr1_<opaque>
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
        "400":
          description: Malformed JSON, unknown/duplicate fields, invalid email or overlong password.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "401":
          description: Email or password does not match a usable credential.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentials"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Verification, storage, entropy or shared admission is unavailable. No details are disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/LoginUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a one-time refresh credential
      description: >-
        Accepts only refresh_token in at most 8192 bytes of JSON. A successful
        rotation consumes the credential and returns fresh opaque access and
        refresh secrets for the same session. Access lasts 15 minutes; refresh
        validity restarts at 30 days, without an absolute session-age cap.
        Ordinary API activity alone does not extend the refresh deadline.
        Reuse of any consumed generation revokes its whole session family,
        including an expired consumed generation. Other sessions are unaffected.
        Concurrent refreshes or retry after a lost successful response can force
        fresh login. Clients must serialize refresh and replace both secrets
        together. Existing access rows remain, but eventual access validation
        must reject revoked families. No cookies, financial authority or bearer
        middleware are provided. All responses use Cache-Control no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
                  description: Complete opaque refresh credential received at login or last rotation.
                  example: cr1_<opaque>
      responses:
        "200":
          description: The credential was consumed and a new pair persisted atomically.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
              example:
                access_token: ca1_<opaque>
                refresh_token: cr1_<opaque>
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
        "400":
          description: Malformed JSON, missing/wrong-type refresh_token, or unknown/duplicate fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "401":
          description: Malformed, unknown, expired, revoked or consumed refresh credential. Consumed-token reuse commits family revocation before rejection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRefreshToken"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Missing database configuration, storage/entropy failure or full refresh capacity. A lost commit response can be ambiguous; retrying a consumed predecessor may revoke its family.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/RefreshUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke the family identified by a retained refresh credential
      description: >-
        Strict JSON up to 8192 bytes. Access is not required. Any retained refresh
        generation, including consumed/expired, can revoke its own family.
        Unknown/malformed secrets and already revoked families have the same
        empty 204 response. Revocation timestamps and token history are retained.
        Other sessions/users are unaffected. All responses are no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "204":
          $ref: "#/components/responses/LogoutSuccess"
        "400":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /auth/logout-all:
    post:
      operationId: logoutAllSessions
      summary: Reauthenticate and revoke every session of the authenticated user
      description: >-
        Requires a valid access bearer and the current exact-byte password.
        Strict JSON up to 8192 bytes; password up to 128 Unicode scalars/512 UTF-8
        bytes. User/session IDs are derived only from the bearer, never caller
        owner hints. Revokes the authorizing session too. Shares the credential
        row lock with login: earlier logins are included, later logins may create
        fresh sessions. Family locks serialize refresh/logout. Existing handlers
        already admitted by middleware are not cancelled. No credentials or
        token history are deleted. Repeat after success requires a fresh login.
        All responses are no-store. A lost commit response can be ambiguous.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 128
      responses:
        "204":
          $ref: "#/components/responses/LogoutSuccess"
        "400":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "401":
          description: Invalid/missing access bearer, wrong/stale password or newly revoked authorizing family. No submitted values disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            WWW-Authenticate:
              description: Present for bearer rejection only; Bearer when missing, otherwise Bearer error="invalid_token".
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidAccessToken"
                  - $ref: "#/components/schemas/InvalidCredentials"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque ca1_ credential
  responses:
    LogoutSuccess:
      description: Revocation completed; no response body, replacement tokens or cookies.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    LogoutInvalidRequest:
      description: Malformed JSON, missing/wrong-type or unknown/duplicate fields (400), oversized JSON (413), unsupported/missing JSON media type (415); overlong password is 400.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequest"
    LogoutUnavailable:
      description: Storage, password verification, bounded admission or client protection unavailable; revocation may have committed if the commit response was lost.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthenticationUnavailable"
              - $ref: "#/components/schemas/ProtectionUnavailable"
              - $ref: "#/components/schemas/RequestIdUnavailable"

    RateLimited:
      description: Authentication attempt budget exhausted. No storage or password work is performed after rejection. No identity existence is disclosed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          required: true
          description: Positive integer seconds until the exhausted window expires; rejected attempts do not extend it.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          example: "60"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
    MethodNotAllowed:
      description: Method is not supported for the matched path. HEAD suppresses the body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Allow:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodNotAllowed"
    NotFound:
      description: Unmatched paths use this response; no submitted path or query is echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFound"
  headers:
    RequestId:
      required: true
      description: Server-generated diagnostic ID; supplied values are replaced, never trusted.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    OptionalRequestId:
      required: false
      description: Absent only for request_id_unavailable (OS entropy failure before the handler).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
  schemas:
    RateLimited:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: rate_limited
            message:
              const: Too many requests. Try again later.
            request_id:
              type: string
    ProtectionUnavailable:
      description: Client identity cannot be trusted or protection state is unavailable. Always Cache-Control no-store. No submitted value or diagnostic is disclosed.
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: protection_unavailable
            message:
              const: Request protection is temporarily unavailable.
            request_id:
              type: string
    SessionTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900
        refresh_expires_in:
          type: integer
          const: 2592000
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
        message:
          type: string
          minLength: 1
        details:
          type: "null"
        request_id:
          type: [string, "null"]
          pattern: '^[0-9a-f]{32}$'
          description: Matches X-Request-ID; null only when OS entropy prevents generation.
    InvalidRequest:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_request
            message:
              const: The request is invalid.
            request_id:
              type: string
    RegistrationUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: registration_unavailable
            message:
              const: Registration is temporarily unavailable.
            request_id:
              type: string
    InvalidCredentials:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_credentials
            message:
              const: The credentials are invalid.
            request_id:
              type: string
    LoginUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: login_unavailable
            message:
              const: Login is temporarily unavailable.
            request_id:
              type: string
    InvalidRefreshToken:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_refresh_token
            message:
              const: The refresh token is invalid.
            request_id:
              type: string
    RefreshUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: refresh_unavailable
            message:
              const: Refresh is temporarily unavailable.
            request_id:
              type: string
    InvalidAccessToken:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_access_token
            message:
              const: The access token is invalid.
            request_id:
              type: string
    AuthenticationUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: authentication_unavailable
            message:
              const: Authentication is temporarily unavailable.
            request_id:
              type: string
    NotFound:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: not_found
            message:
              const: The resource was not found.
            request_id:
              type: string
    MethodNotAllowed:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: method_not_allowed
            message:
              const: The method is not allowed.
            request_id:
              type: string
    RequestIdUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: request_id_unavailable
            message:
              const: The request is temporarily unavailable.
            request_id:
              type: "null"
