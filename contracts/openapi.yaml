  /v1/recurring-rules/{id}/resume:
    post:
      operationId: resumeRecurringRule
      summary: Resume without backfilling paused dates
      description: >-
        Verified owner only; explicit named rule zone, no profile-zone fallback.
        No query parameters, unknown/duplicate JSON fields or server-owned fields.
        Maximum JSON body 8192 bytes. No financial posting or occurrence mutation.
        Creation requires a permanent owner-scoped key; equivalent normalized
