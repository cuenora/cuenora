openapi: 3.1.0
info:
  title: Cuenora API
  version: 0.1.0
  description: >-
    Versioned local API with liveness, registration, login, refresh, logout and verified-owner account creation. All paths use /v1 without legacy aliases.
    Errors have code, message, details (null) and request_id. Success payloads
    are unchanged. Authentication POST routes apply process-local fixed 60-second
    limits: registration 5/client IP, login 20/client IP and 10/canonical email
    across IPs, refresh and logout 60/client IP each, logout-all 20/client IP
    and 10/authenticated user across IPs. IPv6 clients share a /64 bucket. All attempts
    count; IP protection runs before payload validation. Exhaustion returns 429
    with Retry-After. Missing/untrusted client identity or unavailable bounded
    protection state returns 503 protection_unavailable. See ADR-020 for exact
    trusted-proxy configuration and deployment prerequisites. X-Request-ID is server-generated on every application response
    except 503 request_id_unavailable, whose request_id is null and header absent.
    Unmatched paths use components.responses.NotFound; unsupported methods use
    components.responses.MethodNotAllowed. HTTP parse failures before Axum,
    disconnects and panics are outside this contract. Error-envelope replacement
    is intentional; clients must read code instead of the former error field.
servers:
  - url: http://127.0.0.1:3000
paths:
  /v1/health/live:
    get:
      operationId: healthLive
      summary: Check process liveness
      description: Returns a static response without checking database readiness.
      responses:
        "200":
          description: The HTTP process is responding.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain:
              schema:
                type: string
                const: OK
              example: OK
        "503":
          description: Request ID generation is unavailable; no database check is involved.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a pending identity
      description: >-
        Accepts only email and password in at most 8192 bytes of JSON. Email uses
        an ASCII local part and IDNA domain; comparison is case-insensitive, but
        dots and plus tags remain significant. Passwords contain 15–128 Unicode
        scalar values, allow spaces, and must pass offline common-password
        screening. Hashing preserves exact UTF-8 bytes. Valid new and duplicate
        registrations return the same response without replacing credentials.
        Creates no session or financial authority; does not send verification mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Original input; up to 1024 UTF-8 bytes and 254 bytes after IDNA conversion.
                  example: synthetic+tag@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  minLength: 15
                  maxLength: 128
                  example: violet hills beside summer rivers
      responses:
        "202":
          description: Accepted without disclosing whether an identity already exists.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    const: accepted
              example: {status: accepted}
        "400":
          description: Malformed JSON, unknown/duplicate fields, or rejected email/password policy.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Registration unavailable, including missing database configuration or full admission capacity. Retry later; no database details are disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/RegistrationUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate and issue an opaque session
      description: >-
        Accepts email and exact password bytes in at most 8192 bytes of JSON.
        Password verification accepts existing passwords up to 128 Unicode
        scalar values and 512 UTF-8 bytes without registration's signup policy.
        Unknown identities and incorrect passwords share the same response.
        Pending users may log in, but this response grants no financial access.
        The server stores only access and refresh token digests. Tokens are
        returned once and must be treated as opaque. Refresh rotation is available
        through POST /v1/auth/refresh. Route-scoped bearer identity middleware is
        implemented; account creation separately enforces verified-email ownership.
        Other financial endpoints and posting authorization remain pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email:
                  type: string
                  description: Original input; ASCII local part with IDNA domain.
                  example: synthetic+tag@example.test
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 128
                  example: violet hills beside summer rivers
      responses:
        "200":
          description: Credentials verified and a new session/token family was persisted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
                properties:
                  access_token:
                    type: string
                    readOnly: true
                  refresh_token:
                    type: string
                    readOnly: true
                  token_type:
                    type: string
                    const: Bearer
                  expires_in:
                    type: integer
                    const: 900
                  refresh_expires_in:
                    type: integer
                    const: 2592000
              example:
                access_token: ca1_<opaque>
                refresh_token: cr1_<opaque>
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
        "400":
          description: Malformed JSON, unknown/duplicate fields, invalid email or overlong password.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "401":
          description: Email or password does not match a usable credential.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidCredentials"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Verification, storage, entropy or shared admission is unavailable. No details are disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/LoginUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a one-time refresh credential
      description: >-
        Accepts only refresh_token in at most 8192 bytes of JSON. A successful
        rotation consumes the credential and returns fresh opaque access and
        refresh secrets for the same session. Access lasts 15 minutes; refresh
        validity restarts at 30 days, without an absolute session-age cap.
        Ordinary API activity alone does not extend the refresh deadline.
        Reuse of any consumed generation revokes its whole session family,
        including an expired consumed generation. Other sessions are unaffected.
        Concurrent refreshes or retry after a lost successful response can force
        fresh login. Clients must serialize refresh and replace both secrets
        together. Existing access rows remain, but eventual access validation
        must reject revoked families. No cookies, financial authority or bearer
        middleware are provided. All responses use Cache-Control no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
                  description: Complete opaque refresh credential received at login or last rotation.
                  example: cr1_<opaque>
      responses:
        "200":
          description: The credential was consumed and a new pair persisted atomically.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionTokens"
              example:
                access_token: ca1_<opaque>
                refresh_token: cr1_<opaque>
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 2592000
        "400":
          description: Malformed JSON, missing/wrong-type refresh_token, or unknown/duplicate fields.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "401":
          description: Malformed, unknown, expired, revoked or consumed refresh credential. Consumed-token reuse commits family revocation before rejection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRefreshToken"
        "413":
          description: JSON body exceeds 8192 bytes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "415":
          description: Missing or unsupported JSON content type.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: Missing database configuration, storage/entropy failure or full refresh capacity. A lost commit response can be ambiguous; retrying a consumed predecessor may revoke its family.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OptionalRequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ProtectionUnavailable"
                  - $ref: "#/components/schemas/RefreshUnavailable"
                  - $ref: "#/components/schemas/RequestIdUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/logout:
    post:
      operationId: logoutSession
      summary: Revoke the family identified by a retained refresh credential
      description: >-
        Strict JSON up to 8192 bytes. Access is not required. Any retained refresh
        generation, including consumed/expired, can revoke its own family.
        Unknown/malformed secrets and already revoked families have the same
        empty 204 response. Revocation timestamps and token history are retained.
        Other sessions/users are unaffected. All responses are no-store.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  format: password
                  writeOnly: true
      responses:
        "204":
          $ref: "#/components/responses/LogoutSuccess"
        "400":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /v1/auth/logout-all:
    post:
      operationId: logoutAllSessions
      summary: Reauthenticate and revoke every session of the authenticated user
      description: >-
        Requires a valid access bearer and the current exact-byte password.
        Strict JSON up to 8192 bytes; password up to 128 Unicode scalars/512 UTF-8
        bytes. User/session IDs are derived only from the bearer, never caller
        owner hints. Revokes the authorizing session too. Shares the credential
        row lock with login: earlier logins are included, later logins may create
        fresh sessions. Family locks serialize refresh/logout. Existing handlers
        already admitted by middleware are not cancelled. No credentials or
        token history are deleted. Repeat after success requires a fresh login.
        All responses are no-store. A lost commit response can be ambiguous.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                  maxLength: 128
      responses:
        "204":
          $ref: "#/components/responses/LogoutSuccess"
        "400":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "401":
          description: Invalid/missing access bearer, wrong/stale password or newly revoked authorizing family. No submitted values disclosed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            WWW-Authenticate:
              description: Present for bearer rejection only; Bearer when missing, otherwise Bearer error="invalid_token".
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/InvalidAccessToken"
                  - $ref: "#/components/schemas/InvalidCredentials"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/LogoutUnavailable"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /v1/me:
    patch:
      operationId: confirmProfileTimeZone
      summary: Explicitly confirm or update the authenticated profile IANA zone
      description: >-
        Accepts only time_zone in at most 8192 bytes of strict JSON. No unknown or
        duplicate fields. Pending-email identities may configure their profile;
        this grants no financial authority. Preserve the exact supported named
        identifier or alias; reject numeric offsets, whitespace and unknown names.
        Same-value retry leaves updated_at unchanged. No GET or other profile
        mutations are implemented. The owner comes only from bearer identity.
      security:
        - AccessBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [time_zone]
              properties:
                time_zone:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Exact supported IANA identifier or recognized alias from the compiled chrono-tz catalog.
                  example: Europe/Stockholm
      responses:
        "200":
          description: Zone explicitly confirmed; no other profile field returned.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [time_zone]
                properties:
                  time_zone: {type: string}
              example: {time_zone: Europe/Stockholm}
        "400":
          $ref: "#/components/responses/ProfileZoneError"
        "401":
          description: Missing, invalid, expired or revoked bearer, no profile write.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/ProfileZoneError"
        "415":
          $ref: "#/components/responses/ProfileZoneError"
        "503":
          $ref: "#/components/responses/ProfileZoneError"

  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List the authenticated owner's accounts and current balances
      description: >-
        Requires a current verified email and active bearer session. Only the
        authenticated owner's accounts are returned; no profile time zone is
        required. Active and archived accounts are included without an archive
        filter or mutation. Names are returned exactly as stored. Each item has
        id, name, account_type, currency, status and balance. Balance is the exact
        sum of all signed account movements, including compensations regardless
        of current event state, in the account currency. No movements means 0.00;
        negative balances are valid. No history filter or cross-account total is
        provided. Unrepresentable totals fail the page safely with 503; posting
        data is not exposed. JSON response is no-store. Query fields are
        strict, unique and limited to 1024 UTF-8 bytes; GET bodies must be empty
        and are limited to 8192 bytes. Pages order by created_at ascending and
        id ascending. The opaque cursor is the last returned account UUID and is
        resolved only among the authenticated owner's accounts. A page uses one
        repeatable-read, read-only database snapshot; cursor/page failures never
        become an empty success response.
      security:
        - AccessBearer: []
      parameters:
        - in: query
          name: limit
          required: false
          description: Results per page; defaults to 50.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - in: query
          name: cursor
          required: false
          description: Opaque cursor from next_cursor; must identify an owned account.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: One bounded owner-scoped account page.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListing"
              example:
                accounts:
                  - id: 00000000-0000-0000-0000-000000000001
                    name: Daily
                    account_type: normal
                    currency: SEK
                    status: active
                    balance: "123.45"
                next_cursor: null
        "400":
          $ref: "#/components/responses/AccountListingError"
        "401":
          description: Missing, invalid, expired or revoked bearer; no data is returned.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/AccountListingError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/AccountListingError"
        "503":
          $ref: "#/components/responses/AccountListingError"
    post:
      operationId: createAccount
      summary: Create an owned account exactly once per idempotency key
      description: >-
        Requires verified email and an active bearer. Omit opening_balance for the
        existing metadata-only operation without a zone requirement. An explicit
        opening object requires a confirmed supported IANA profile zone and an
        explicit nonfuture business date. A nonzero amount creates a special
        opening_balance event, signed movement and minimal audit atomically
        with the account and key; zero creates no financial posting.
        JSON is limited to 8192 bytes; unknown and duplicate fields are rejected.
        Name uses domain Unicode outer trimming, 1–255 scalar values and no ASCII controls.
        Keys are scoped to the authenticated owner and account creation, retained
        for the account lifetime with no expiry. Same normalized name/type/currency
        and optional opening minor amount/date replay the original 201 result;
        changed content conflicts without writes. Existing no-opening keys remain
        valid. Replay does not repost or revalidate a previously accepted date
        after a profile-zone change.
        Retry uncertain responses with the same key. Verification email/confirmation
        runtime remains pending; there is no financial authorization bypass.
      security:
        - AccessBearer: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Case-sensitive unique key per intended creation; exactly one header value.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, account_type, currency]
              properties:
                name:
                  type: string
                  description: Normalized length must be 1–255 Unicode scalar values.
                account_type:
                  type: string
                  enum: [normal, savings]
                currency:
                  type: string
                  enum: [SEK, EUR, USD]
                opening_balance:
                  type: object
                  additionalProperties: false
                  required: [amount, occurred_on]
                  description: Optional explicit opening instruction, never null; zero still validates its declared date/zone but creates no event/movement/audit.
                  properties:
                    amount:
                      type: string
                      pattern: '^-?[0-9]+(\.[0-9]{1,2})?$'
                      description: Exact signed Money minor-unit bounds; account currency applies, no rounding.
                      example: "1250.00"
                    occurred_on:
                      type: string
                      format: date
                      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
                      description: Gregorian 0001-01-01 through 9999-12-31; no later than today in confirmed profile zone.
                      example: "2026-10-01"
            example: {name: Daily, account_type: normal, currency: SEK}
      responses:
        "201":
          description: Created account or original creation result replayed, even after later metadata changes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, name, account_type, currency, status]
                properties:
                  id: {type: string, format: uuid}
                  name: {type: string, minLength: 1, maxLength: 255}
                  account_type: {type: string, enum: [normal, savings]}
                  currency: {type: string, enum: [SEK, EUR, USD]}
                  status: {type: string, const: active}
        "400":
          $ref: "#/components/responses/AccountCreationError"
        "401":
          description: Missing, invalid, expired or revoked bearer; no writes.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/AccountCreationError"
        "409":
          $ref: "#/components/responses/AccountCreationError"
        "413":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "415":
          $ref: "#/components/responses/LogoutInvalidRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AccountCreationError"

  /v1/accounts/{id}:
    patch:
      operationId: updateAccount
      summary: Rename, archive or reactivate an owned account
      description: >-
        Requires current verified email and an active bearer. Only name/status
        may change; profile time zone is unnecessary. Strict unique JSON fields,
        no explicit null or query parameters, at least one field, 8192-byte body.
        Names use the existing Unicode trim/scalar/control policy; duplicates
        remain allowed, including archived-account names. An active-to-archived
        transition requires an exact zero signed posting sum, including
        compensations regardless of event state. Nonzero totals reject the whole
        request without a partial rename. Owner then account locks serialize the
        READ COMMITTED sum/state update. Same assignments do not change timestamps.
        Archived history/balance remain queryable; reactivation enables future
        postings without changing history. Future income/expense/transfer routes
        must lock in the same order and reject archived accounts before posting;
        historical-correction policy remains separate. No deletion, balance,
        type, currency or owner update. Original creation-key replay is unchanged.
        Concurrent same-field assignments are last-writer-wins; this is not
        lifetime Idempotency-Key replay. Commit acknowledgement may be uncertain;
        retry the assignment only with awareness of intervening edits.
      security:
        - AccessBearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
          description: Owned account UUID; uppercase hex is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                status: {type: string, enum: [active, archived]}
            example: {name: Daily expenses, status: archived}
      responses:
        "200":
          description: Current five-field account metadata; no financial changes.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountMetadata"
        "400":
          $ref: "#/components/responses/AccountManagementError"
        "401":
          description: Missing, invalid, expired or revoked bearer; no writes.
          headers:
            WWW-Authenticate:
              schema: {type: string}
              description: Bearer when missing, otherwise Bearer error="invalid_token".
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAccessToken"
        "403":
          $ref: "#/components/responses/AccountManagementError"
        "404":
          $ref: "#/components/responses/AccountManagementError"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/AccountManagementError"
        "413":
          $ref: "#/components/responses/AccountManagementError"
        "415":
          $ref: "#/components/responses/AccountManagementError"
        "503":
          $ref: "#/components/responses/AccountManagementError"

components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque ca1_ credential
  responses:
    AccountManagementError:
      description: >-
        400 invalid_request for invalid UUID/JSON/name/status/fields/query;
        403 email_not_verified; 404 not_found (The resource was not found.) for
        missing or foreign accounts identically; 409 account_balance_not_zero
        (Archive requires a zero account balance.); 413/415 invalid_request;
        503 account_update_unavailable (Account update is temporarily unavailable.),
        authentication_unavailable or request_id_unavailable. Errors disclose no
        submitted values or storage diagnostics and never return partial metadata.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ProfileZoneError:
      description: >-
        400 invalid_request or unsupported_time_zone (The time zone is unsupported.);
        413/415 invalid_request; 503 profile_update_unavailable (Profile update is
        temporarily unavailable.), authentication_unavailable or request_id_unavailable.
        No submitted values or database diagnostics are echoed; rejected changes write nothing.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountCreationError:
      description: >-
        400 invalid_request, invalid_business_date (The business date is invalid.),
        date_out_of_range (The business date is out of range.), future_business_date
        (The business date cannot be in the future.) or unsupported_time_zone
        (The time zone is unsupported.); 403 email_not_verified (Email verification is required.);
        409 profile_zone_unconfirmed (Confirm the profile time zone first.);
        409 idempotency_conflict (The idempotency key was used for a different request.);
        503 account_creation_unavailable (Account creation is temporarily unavailable.),
        authentication_unavailable or request_id_unavailable. A transaction failure
        or lost commit response may have an uncertain outcome; retry the same key.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountListingError:
      description: >-
        400 invalid_request for invalid limits, unknown/duplicate query fields,
        malformed/non-owned cursors or nonempty GET bodies; 403 email_not_verified;
        413 invalid_request for an oversized GET body; 503 account_listing_unavailable
        (Account listing is temporarily unavailable.), authentication_unavailable
        or request_id_unavailable. Foreign and unknown cursors have the same safe
        response. An aggregate outside the Money range also returns the safe
        503 account_listing_unavailable, never a partial page or fabricated zero.
        No data or database diagnostics are echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    LogoutSuccess:
      description: Revocation completed; no response body, replacement tokens or cookies.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    LogoutInvalidRequest:
      description: Malformed JSON, missing/wrong-type or unknown/duplicate fields (400), oversized JSON (413), unsupported/missing JSON media type (415); overlong password is 400.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequest"
    LogoutUnavailable:
      description: Storage, password verification, bounded admission or client protection unavailable; revocation may have committed if the commit response was lost.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthenticationUnavailable"
              - $ref: "#/components/schemas/ProtectionUnavailable"
              - $ref: "#/components/schemas/RequestIdUnavailable"

    RateLimited:
      description: Authentication attempt budget exhausted. No storage or password work is performed after rejection. No identity existence is disclosed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          required: true
          description: Positive integer seconds until the exhausted window expires; rejected attempts do not extend it.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          example: "60"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
    MethodNotAllowed:
      description: Method is not supported for the matched path. HEAD suppresses the body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Allow:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodNotAllowed"
    NotFound:
      description: Unmatched paths use this response; no submitted path or query is echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFound"
  headers:
    RequestId:
      required: true
      description: Server-generated diagnostic ID; supplied values are replaced, never trusted.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    OptionalRequestId:
      required: false
      description: Absent only for request_id_unavailable (OS entropy failure before the handler).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
  schemas:
    AccountMetadata:
      type: object
      additionalProperties: false
      required: [id, name, account_type, currency, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        account_type: {type: string, enum: [normal, savings]}
        currency: {type: string, enum: [SEK, EUR, USD]}
        status: {type: string, enum: [active, archived]}
    AccountWithBalance:
      type: object
      additionalProperties: false
      required: [id, name, account_type, currency, status, balance]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        account_type: {type: string, enum: [normal, savings]}
        currency: {type: string, enum: [SEK, EUR, USD]}
        status: {type: string, enum: [active, archived]}
        balance:
          type: string
          readOnly: true
          pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
          description: >-
            Current exact signed balance in this account's currency; symmetric
            range -92233720368547758.07 through 92233720368547758.07.
            Zero is 0.00, never negative zero. No client-supplied balance accepted.
    AccountListing:
      type: object
      additionalProperties: false
      required: [accounts, next_cursor]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountWithBalance"
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: UUID of the last returned account when more rows exist; otherwise null.
    RateLimited:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: rate_limited
            message:
              const: Too many requests. Try again later.
            request_id:
              type: string
    ProtectionUnavailable:
      description: Client identity cannot be trusted or protection state is unavailable. Always Cache-Control no-store. No submitted value or diagnostic is disclosed.
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: protection_unavailable
            message:
              const: Request protection is temporarily unavailable.
            request_id:
              type: string
    SessionTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, refresh_expires_in]
      properties:
        access_token:
          type: string
          readOnly: true
        refresh_token:
          type: string
          readOnly: true
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900
        refresh_expires_in:
          type: integer
          const: 2592000
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code:
          type: string
        message:
          type: string
          minLength: 1
        details:
          type: "null"
        request_id:
          type: [string, "null"]
          pattern: '^[0-9a-f]{32}$'
          description: Matches X-Request-ID; null only when OS entropy prevents generation.
    InvalidRequest:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_request
            message:
              const: The request is invalid.
            request_id:
              type: string
    RegistrationUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: registration_unavailable
            message:
              const: Registration is temporarily unavailable.
            request_id:
              type: string
    InvalidCredentials:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_credentials
            message:
              const: The credentials are invalid.
            request_id:
              type: string
    LoginUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: login_unavailable
            message:
              const: Login is temporarily unavailable.
            request_id:
              type: string
    InvalidRefreshToken:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_refresh_token
            message:
              const: The refresh token is invalid.
            request_id:
              type: string
    RefreshUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: refresh_unavailable
            message:
              const: Refresh is temporarily unavailable.
            request_id:
              type: string
    InvalidAccessToken:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: invalid_access_token
            message:
              const: The access token is invalid.
            request_id:
              type: string
    AuthenticationUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: authentication_unavailable
            message:
              const: Authentication is temporarily unavailable.
            request_id:
              type: string
    NotFound:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: not_found
            message:
              const: The resource was not found.
            request_id:
              type: string
    MethodNotAllowed:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: method_not_allowed
            message:
              const: The method is not allowed.
            request_id:
              type: string
    RequestIdUnavailable:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: request_id_unavailable
            message:
              const: The request is temporarily unavailable.
            request_id:
              type: "null"
