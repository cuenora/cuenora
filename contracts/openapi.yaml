          properties:
            numerator: {type: string, pattern: '^[0-9]+$'}
            denominator: {type: string, pattern: '^[1-9][0-9]*$'}
        projected_payout:
          type: [string, "null"]
          pattern: '^[0-9]+\.[0-9]{2}$'
          description: Arbitrary-precision decimal currency estimate at natural period close, half-even; null for an open tail. Never a posted receipt.
