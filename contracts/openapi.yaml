        account_id: {type: [string, "null"], format: uuid}
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 1000}
        cadence: {type: string, enum: [weekly, monthly, quarterly, annual]}
        starts_on: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        ends_on: {type: [string, "null"], format: date, description: Inclusive; must not precede starts_on.}
        time_zone: {type: string, minLength: 1, maxLength: 255}
    RecurringRule:
      type: object
      additionalProperties: false
      description: Exact positive amount up to 92233720368547758.07; no control characters in description; explicit supported IANA zone. Dates use years 0001–9999.
      required: [id, amount, currency, account_id, category_id, description, cadence, starts_on, ends_on, time_zone, state, paused_on, generated_through]
      properties:
        amount: {type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
        currency: {type: string, enum: [SEK, EUR, USD]}
        account_id: {type: [string, "null"], format: uuid}
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 1000}
        cadence: {type: string, enum: [weekly, monthly, quarterly, annual]}
        starts_on: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        ends_on: {type: [string, "null"], format: date, description: Inclusive; must not precede starts_on.}
        time_zone: {type: string, minLength: 1, maxLength: 255}
        id: {type: string, format: uuid}
        state: {type: string, enum: [active, paused]}
        paused_on: {type: [string, "null"], format: date}
        generated_through: {type: [string, "null"], format: date, description: Inclusive covered-date cursor; never a calendar anchor.}
    RecurringRuleTransition:
      type: object
      additionalProperties: false
      maxProperties: 0
    TransactionPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Maximum 8192 JSON bytes; duplicate fields rejected. Final event must
        satisfy account/currency/category/kind relationships, not just field
        shapes. Only openings may be signed or zero. Transfers require positive
        sent/received amounts and distinct accounts; same-currency amounts match.
        Openings and interest require an account; income/expense may be accountless.
        Explicit null clears nullable fields only when the resulting event is valid.
      properties:
        amount: {type: string, pattern: '^-?[0-9]+(\.[0-9]{1,2})?$'}
        currency: {type: string, enum: [SEK, EUR, USD]}
        occurred_on: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
        account_id: {type: [string, "null"], format: uuid}
        destination_account_id: {type: [string, "null"], format: uuid}
        received_amount: {type: [string, "null"], pattern: '^[0-9]+(\.[0-9]{1,2})?$'}
        received_currency: {type: [string, "null"], enum: [SEK, EUR, USD, null]}
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 1000, description: No control characters.}
    TransactionListing:
      type: object
      additionalProperties: false
      required: [transactions, next_cursor]
      properties:
        transactions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RecordedTransaction"
        next_cursor:
          type: [string, "null"]
          format: uuid
    RecordedTransaction:
      type: object
      additionalProperties: false
      required: [id, kind, state, amount, currency, occurred_on, account_id, category_id, description, destination_account_id, received_amount, received_currency]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [income, expense, transfer, opening_balance, interest_income]}
        state: {type: string, enum: [posted, voided]}
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
        currency: {type: string, enum: [SEK, EUR, USD]}
        occurred_on: {type: string, format: date}
        account_id: {type: [string, "null"], format: uuid}
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"]}
        destination_account_id: {type: [string, "null"], format: uuid}
        received_amount:
          type: [string, "null"]
          pattern: '^[0-9]+\.[0-9]{2}$'
        received_currency: {type: [string, "null"], enum: [SEK, EUR, USD, null]}
        quoted_rate: {$ref: "#/components/schemas/CanonicalQuotedRate"}
        rate_comparison: {$ref: "#/components/schemas/RateComparison"}
    AccountlessIncomeInput:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, occurred_on]
      properties:
        kind: {type: string, const: income}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: Positive exact amount, maximum 92233720368547758.07, never rounded.
        currency: {type: string, enum: [SEK, EUR, USD]}
        occurred_on:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Explicit valid Gregorian date, years 0001–9999, no future dates in confirmed profile zone.
        account_id:
          type: [string, "null"]
          format: uuid
          description: Owned active normal account in the income currency; absent/null means accountless. Canonical hyphenated UUID, hex normalized lowercase.
        category_id:
          type: [string, "null"]
          format: uuid
          description: Existing income category, canonical hyphenated UUID; case normalized lowercase.
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Exact text, no control characters; null/absence equivalent, empty string distinct.
    CreatedAccountlessIncome:
      type: object
      additionalProperties: false
      required: [id, kind, state, amount, currency, occurred_on, account_id, category_id, description]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, const: income}
        state: {type: string, const: posted}
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          description: Positive normalized exact decimal string.
        currency: {type: string, enum: [SEK, EUR, USD]}
        occurred_on: {type: string, format: date}
        account_id:
          type: [string, "null"]
          format: uuid
          description: Original normalized account UUID or null; replay preserves the original assignment, not the current account state.
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 1000}
    OccurrenceSkipInput:
      type: object
      additionalProperties: false
      maxProperties: 0
    OccurrencePostponeInput:
      type: object
      additionalProperties: false
      required: [due_on]
      properties:
        due_on:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Valid Gregorian date, years 0001–9999, strictly after current due_on, including beyond rule end.
    OccurrenceActionResult:
      type: object
      additionalProperties: false
      required: [id, scheduled_on, due_on, state]
      properties:
        id: {type: string, format: uuid}
        scheduled_on: {type: string, format: date}
        due_on: {type: string, format: date}
        state: {type: string, enum: [planned, skipped]}
    RecurringConfirmationInput:
      type: object
      additionalProperties: false
      required: [amount, currency, occurred_on]
      properties:
        amount:
          $ref: "#/components/schemas/AccountlessExpenseInput/properties/amount"
        currency:
          $ref: "#/components/schemas/AccountlessExpenseInput/properties/currency"
        occurred_on:
          $ref: "#/components/schemas/AccountlessExpenseInput/properties/occurred_on"
        account_id:
          $ref: "#/components/schemas/AccountlessExpenseInput/properties/account_id"
        category_id:
          $ref: "#/components/schemas/AccountlessExpenseInput/properties/category_id"
        description:
          $ref: "#/components/schemas/AccountlessExpenseInput/properties/description"
    AccountlessExpenseInput:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, occurred_on]
      properties:
        kind: {type: string, const: expense}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: Positive exact amount, maximum 92233720368547758.07, never rounded.
        currency: {type: string, enum: [SEK, EUR, USD]}
        occurred_on:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Explicit valid Gregorian date, years 0001–9999, no future dates in confirmed profile zone.
        account_id:
          type: [string, "null"]
          format: uuid
          description: Optional owned active normal or savings account in the expense currency; UUID hex case normalized lowercase.
        category_id:
          type: [string, "null"]
          format: uuid
          description: Existing expense category, canonical hyphenated UUID; case normalized lowercase.
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Exact text, no control characters; null/absence equivalent, empty string distinct.
    CreatedAccountlessExpense:
      type: object
      additionalProperties: false
      required: [id, kind, state, amount, currency, occurred_on, account_id, category_id, description]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, const: expense}
        state: {type: string, const: posted}
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          description: Positive normalized exact decimal string.
        currency: {type: string, enum: [SEK, EUR, USD]}
        occurred_on: {type: string, format: date}
        account_id:
          type: [string, "null"]
          format: uuid
          description: Null without an account; otherwise the account debited exactly once.
        category_id: {type: [string, "null"], format: uuid}
        description: {type: [string, "null"], maxLength: 1000}
    TransferInput:
      type: object
      additionalProperties: false
      required: [kind, amount, currency, account_id, destination_account_id, received_amount, received_currency, occurred_on]
      properties:
        kind: {type: string, const: transfer}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: Positive sent amount, maximum 92233720368547758.07; no rounding.
        currency: {type: string, enum: [SEK, EUR, USD]}
        account_id: {type: string, format: uuid, description: Owned active source account in the sent currency.}
        destination_account_id: {type: string, format: uuid, description: Distinct owned active destination in the received currency.}
        received_amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,2})?$'
          description: Positive actual received amount, maximum 92233720368547758.07; equal to sent amount for same-currency transfers.
        received_currency: {type: string, enum: [SEK, EUR, USD]}
        quoted_rate:
          type: [string, "null"]
          pattern: '^[0-9]+(\.[0-9]{1,12})?$'
          description: Positive exact destination units per source unit; null/absence means no quote. Coefficient and sent minor units times coefficient must fit signed i128; the half-even indicative amount must fit Money. Leading/trailing zeros canonicalize without input rounding.
        occurred_on:
          type: string
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Explicit valid business date, years 0001–9999, past/today in confirmed IANA profile zone.
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Exact text without controls; null/absence equivalent, empty string distinct.
    CreatedTransfer:
      type: object
      additionalProperties: false
      required: [id, kind, state, amount, currency, account_id, destination_account_id, received_amount, received_currency, occurred_on, category_id, description]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, const: transfer}
        state: {type: string, const: posted}
        amount: {type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'}
        currency: {type: string, enum: [SEK, EUR, USD]}
        account_id: {type: string, format: uuid}
        destination_account_id: {type: string, format: uuid}
        received_amount: {type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'}
        received_currency: {type: string, enum: [SEK, EUR, USD]}
        quoted_rate: {$ref: "#/components/schemas/CanonicalQuotedRate"}
        rate_comparison: {$ref: "#/components/schemas/RateComparison"}
        occurred_on: {type: string, format: date}
        category_id: {type: "null"}
        description: {type: [string, "null"], maxLength: 1000}
    CanonicalQuotedRate:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{0,11}[1-9])?$'
      description: Positive canonical entered rate, destination units per source unit. Present only with a quote; never inferred. Zero is invalid.
    RateComparison:
      type: object
      additionalProperties: false
      required: [indicative_received_amount, difference, mismatch]
      description: Informational comparison in received_currency; never a replacement for actual received_amount. History recomputes it from current amounts, even after voiding.
      properties:
        indicative_received_amount: {type: string, pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'}
        difference: {type: string, pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$', description: Actual minus indicative received amount; positive values have no plus sign.}
        mismatch: {type: boolean, description: True exactly when the signed difference is nonzero; clients should present an informational warning.}
    AccountMetadata:
      type: object
      additionalProperties: false
      required: [id, name, account_type, currency, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        account_type: {type: string, enum: [normal, savings]}
        currency: {type: string, enum: [SEK, EUR, USD]}
        status: {type: string, enum: [active, archived]}
    AccountWithBalance:
      type: object
      additionalProperties: false
      required: [id, name, account_type, currency, status, balance]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 255}
        account_type: {type: string, enum: [normal, savings]}
        currency: {type: string, enum: [SEK, EUR, USD]}
        status: {type: string, enum: [active, archived]}
        balance:
          type: string
          readOnly: true
          pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
          description: >-
            Current exact signed balance in this account's currency; symmetric
            range -92233720368547758.07 through 92233720368547758.07.
            Zero is 0.00, never negative zero. No client-supplied balance accepted.
    AccountListing:
      type: object
      additionalProperties: false
      required: [accounts, next_cursor]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccountWithBalance"
        next_cursor:
          type: [string, "null"]
          format: uuid
          description: UUID of the last returned account when more rows exist; otherwise null.
    RateLimited:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: rate_limited
            message:
              const: Too many requests. Try again later.
            request_id:
              type: string
    ProtectionUnavailable:
      description: Client identity cannot be trusted or protection state is unavailable. Always Cache-Control no-store. No submitted value or diagnostic is disclosed.
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - properties:
            code:
              const: protection_unavailable
            message:
              const: Request protection is temporarily unavailable.
            request_id:
              type: string
    SessionTokens:
