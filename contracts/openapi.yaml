components:
  parameters:
    MutationTransactionId:
      in: path
      name: id
      required: true
      schema: {type: string, format: uuid}
    MutationKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_-]+$"}
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque ca1_ credential
  responses:
    SavingsConfigurationError:
      description: >-
        Rejections do not change configuration or financial rows. 400 invalid_request
        or invalid_business_date; 401 invalid_access_token; 403 email_not_verified;
        404 not_found for missing, foreign or normal account; 409 savings_configuration_conflict
        (A different configuration already exists on this effective date.);
        413/415 invalid_request; 405 method_not_allowed; 503 savings_configuration_unavailable
        (Savings configuration is temporarily unavailable.), authentication_unavailable
        or request_id_unavailable. No storage diagnostics are exposed.
      headers:
        X-Request-ID: {$ref: "#/components/headers/OptionalRequestId"}
        Cache-Control: {$ref: "#/components/headers/NoStore"}
        WWW-Authenticate:
          description: Present only on 401; Bearer when missing, otherwise invalid_token.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ApiError"}
    OccurrenceActionError:
      description: >-
        No public rows change on rejection. 400 invalid_request (including equal/earlier
        due_on), invalid_business_date or date_out_of_range; 401 invalid_access_token;
        403 email_not_verified; 404 not_found for missing/foreign occurrence;
        409 idempotency_conflict or occurrence_state_conflict; 413/415 invalid_request;
        503 recurrence_unavailable, authentication_unavailable or request_id_unavailable.
        No storage diagnostics. New terminal actions say Only a planned occurrence
        can be skipped or postponed as a new operation.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RecurringConfirmationError:
      description: >-
        No writes on rejection. 400 invalid_request, invalid_business_date,
        date_out_of_range, future_business_date or unsupported_time_zone;
        401 invalid_access_token; 403 email_not_verified; 404 not_found for
        missing/foreign occurrence or account; 409 profile_zone_unconfirmed,
        idempotency_conflict or occurrence_state_conflict (Only a planned
        occurrence can be confirmed as a new operation.); 413/415 invalid_request;
        503 recurrence_unavailable, authentication_unavailable or request_id_unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RecurringRuleError:
      description: >-
        400 invalid_request, invalid_business_date or unsupported_time_zone;
        401 invalid_access_token (with WWW-Authenticate); 403 email_not_verified;
        404 not_found for missing/foreign rule or account; 409 idempotency_conflict,
        recurrence_account_archived or recurrence_state_conflict;
        413/415 invalid_request; 503 recurrence_unavailable,
        authentication_unavailable or request_id_unavailable. A server-derived
        civil day outside 0001–9999 returns 400 date_out_of_range.
        No storage diagnostics; rejected requests do not change rules or money.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        WWW-Authenticate:
          description: Present only on 401; Bearer when missing, otherwise invalid_token.
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    CategoryListingError:
      description: >-
        400 invalid_request for nonempty query/body; 413 invalid_request for an
        oversized body; 503 category_listing_unavailable (Category listing is
        temporarily unavailable.), authentication_unavailable or
        request_id_unavailable. No storage diagnostics are returned.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountManagementError:
      description: >-
        400 invalid_request for invalid UUID/JSON/name/status/fields/query;
        403 email_not_verified; 404 not_found (The resource was not found.) for
        missing or foreign accounts identically; 409 account_balance_not_zero
        (Archive requires a zero account balance.); 413/415 invalid_request;
        503 account_update_unavailable (Account update is temporarily unavailable.),
        authentication_unavailable or request_id_unavailable. Errors disclose no
        submitted values or storage diagnostics and never return partial metadata.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ProfileZoneError:
      description: >-
        400 invalid_request or unsupported_time_zone (The time zone is unsupported.);
        413/415 invalid_request; 503 profile_update_unavailable (Profile update is
        temporarily unavailable.), authentication_unavailable or request_id_unavailable.
        No submitted values or database diagnostics are echoed; rejected changes write nothing.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TransactionMutationAcknowledgement:
      description: Original ID/state acknowledgement, not a snapshot of current mutable data. Read current state using transaction listing.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id, state]
            properties:
              id: {type: string, format: uuid}
              state: {type: string, enum: [posted, voided]}
    TransactionMutationError:
      description: >-
        400 invalid_request, invalid_business_date, date_out_of_range,
        future_business_date or unsupported_time_zone; 401 invalid_access_token;
        403 email_not_verified; 404 not_found for unknown/foreign events/accounts;
        409 profile_zone_unconfirmed, idempotency_conflict, transaction_voided or
        account_archived; 413/415 invalid_request; 503 transaction_update_unavailable,
        authentication_unavailable or request_id_unavailable. No rejected write
        changes event, postings, audit or retry metadata. Safe generic errors never
        include input values or database diagnostics.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TransactionListingError:
      description: >-
        400 invalid_request (The request is invalid.) for query/body/reference errors;
        403 email_not_verified (Email verification is required.); 413 invalid_request
        for oversized GET bodies; 503 transaction_listing_unavailable (Transaction
        listing is temporarily unavailable.), authentication_unavailable or
        request_id_unavailable. Never returns a partial page or writes financial data.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    IncomeCreationError:
      description: >-
        400 invalid_request (The request is invalid.), invalid_business_date
        (The business date is invalid.), date_out_of_range (The business date is
        out of range.), future_business_date (The business date cannot be in the
        future.), unsupported_time_zone (The time zone is unsupported.);
        403 email_not_verified (Email verification is required.);
        404 not_found (The resource was not found.) for unknown/foreign accounts;
        409 profile_zone_unconfirmed (Confirm the profile time zone first.) or
        idempotency_conflict (The idempotency key was used for a different request.);
        413/415 invalid_request; 503 income_creation_unavailable (Income creation
        is temporarily unavailable.), transfer_creation_unavailable (Transfer creation
        is temporarily unavailable.), expense_creation_unavailable (Expense creation
        is temporarily unavailable.), authentication_unavailable or
        request_id_unavailable. Rejected attempts write no financial data or keys.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountCreationError:
      description: >-
        400 invalid_request, invalid_business_date (The business date is invalid.),
        date_out_of_range (The business date is out of range.), future_business_date
        (The business date cannot be in the future.) or unsupported_time_zone
        (The time zone is unsupported.); 403 email_not_verified (Email verification is required.);
        409 profile_zone_unconfirmed (Confirm the profile time zone first.);
        409 idempotency_conflict (The idempotency key was used for a different request.);
        503 account_creation_unavailable (Account creation is temporarily unavailable.),
        authentication_unavailable or request_id_unavailable. A transaction failure
        or lost commit response may have an uncertain outcome; retry the same key.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AccountListingError:
      description: >-
        400 invalid_request for invalid limits, unknown/duplicate query fields,
        malformed/non-owned cursors or nonempty GET bodies; 403 email_not_verified;
        413 invalid_request for an oversized GET body; 503 account_listing_unavailable
        (Account listing is temporarily unavailable.), authentication_unavailable
        or request_id_unavailable. Foreign and unknown cursors have the same safe
        response. An aggregate outside the Money range also returns the safe
        503 account_listing_unavailable, never a partial page or fabricated zero.
        No data or database diagnostics are echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    LogoutSuccess:
      description: Revocation completed; no response body, replacement tokens or cookies.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
    LogoutInvalidRequest:
      description: Malformed JSON, missing/wrong-type or unknown/duplicate fields (400), oversized JSON (413), unsupported/missing JSON media type (415); overlong password is 400.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InvalidRequest"
    LogoutUnavailable:
      description: Storage, password verification, bounded admission or client protection unavailable; revocation may have committed if the commit response was lost.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/OptionalRequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/AuthenticationUnavailable"
              - $ref: "#/components/schemas/ProtectionUnavailable"
              - $ref: "#/components/schemas/RequestIdUnavailable"

    RateLimited:
      description: Authentication attempt budget exhausted. No storage or password work is performed after rejection. No identity existence is disclosed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          required: true
          description: Positive integer seconds until the exhausted window expires; rejected attempts do not extend it.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
          example: "60"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimited"
    MethodNotAllowed:
      description: Method is not supported for the matched path. HEAD suppresses the body.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
        Allow:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MethodNotAllowed"
    NotFound:
      description: Unmatched paths use this response; no submitted path or query is echoed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFound"
  headers:
    RequestId:
      required: true
      description: Server-generated diagnostic ID; supplied values are replaced, never trusted.
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    OptionalRequestId:
      required: false
      description: Absent only for request_id_unavailable (OS entropy failure before the handler).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
  schemas:
    SavingsTermsInput:
      type: object
      additionalProperties: false
      required: [effective_on, payout_frequency, capitalize, rate_basis, day_count, balance_timing, rounding]
      properties:
        effective_on: {type: string, format: date, description: Explicit inclusive Gregorian date in years 0001–9999; historical and future dates allowed.}
        payout_frequency: {type: string, enum: [daily, monthly, quarterly, annual]}
        capitalize: {type: boolean}
        rate_basis: {type: string, const: nominal_annual}
        day_count: {type: string, const: actual_calendar_year}
        balance_timing: {type: string, const: daily_close}
        rounding: {type: string, const: period_end_half_even}
    SavingsTermsVersion:
      type: object
      additionalProperties: false
      required: [id, effective_on, payout_frequency, capitalize, rate_basis, day_count, balance_timing, rounding]
      properties:
        id: {type: string, format: uuid}
        effective_on: {type: string, format: date, description: Explicit inclusive Gregorian date in years 0001–9999; historical and future dates allowed.}
        payout_frequency: {type: string, enum: [daily, monthly, quarterly, annual]}
        capitalize: {type: boolean}
        rate_basis: {type: string, const: nominal_annual}
        day_count: {type: string, const: actual_calendar_year}
        balance_timing: {type: string, const: daily_close}
        rounding: {type: string, const: period_end_half_even}
    SavingsRateInput:
      type: object
      additionalProperties: false
      required: [effective_on, nominal_annual_percent]
      properties:
        effective_on: {type: string, format: date, description: Explicit inclusive Gregorian date in years 0001–9999; historical and future dates allowed.}
        nominal_annual_percent:
          type: string
          maxLength: 1024
          pattern: '^[0-9]+(\.[0-9]{1,6})?$'
          description: Exact nonnegative nominal annual percentage, not a fraction of one. No exponent, sign, whitespace or rounding. Excess trailing fractional zeros are also rejected.
    SavingsRateVersion:
      type: object
