  /v1/recurring-rules/{id}:
    patch:
      operationId: editRecurringRule
      summary: Edit only future recurrence terms
      description: >-
        Verified owner only; explicit named rule zone, no profile-zone fallback.
        No query parameters, unknown/duplicate JSON fields or server-owned fields.
        Maximum JSON body 8192 bytes. No financial posting or occurrence mutation.
        Creation requires a permanent owner-scoped key; equivalent normalized
        retries return the original creation response even after rule changes.
        Partial edits preserve omitted fields; null clears nullable fields only.
        Actual start/cadence/zone edits advance generated_through to the maximum
        of prior coverage and the edit day in both old/new rule zones. No-op and
        terms-only edits preserve coverage. New/reassigned accounts must be owned,
        currency-compatible and active; existing archived references are retained.
        Pause/resume accept {} and derive today after locking in the rule zone.
        Repeated state assignments are no-ops. Resume unions [paused_on,today)
        into completed exclusions; backwards civil dates reject atomically.
        No anchor reset or existing occurrence change. Delayed state retries after
        an inverse action are new assignments, not historical operation replays.
      security:
        - AccessBearer: []
      parameters:
        - $ref: "#/components/parameters/MutationTransactionId"
