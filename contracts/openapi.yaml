  /v1/recurring-occurrences/{id}/postpone:
    post:
      operationId: postponeRecurringOccurrence
      summary: Move a planned occurrence due date forward
      description: >-
        Verified owner only. Planning changes never post an expense, movement or audit.
        Only planned occurrences accept new actions, including paused/ended rules
        and archived planned accounts. No confirmed profile zone is needed.
        Required due_on must be strictly later than current due_on, years 0001–9999; it may be in the past relative to today or beyond rule end. Only due_on and updated_at change.
        Original slot, planned terms and rule anchor remain unchanged.
        Permanent owner-wide action keys share a namespace across skip/postpone,
        separate from confirmation and rules. Matching retries replay the original
        200 result even after later actions, without undoing them. Changed intent
        or target conflicts. Foreign/missing targets return 404 before retry lookup.
        No query parameters or unknown/duplicate fields; JSON limit 8192 bytes.
      security:
        - AccessBearer: []
      parameters:
        - $ref: "#/components/parameters/MutationTransactionId"
        - $ref: "#/components/parameters/MutationKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrencePostponeInput"
            example: {due_on: "2024-02-05"}
      responses:
        "200":
          description: Original planning action result, including on matching retry; not a current-state read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrenceActionResult"
        "400":
          $ref: "#/components/responses/OccurrenceActionError"
        "401":
          $ref: "#/components/responses/OccurrenceActionError"
        "403":
          $ref: "#/components/responses/OccurrenceActionError"
        "404":
          $ref: "#/components/responses/OccurrenceActionError"
        "409":
