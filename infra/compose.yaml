name: cuenora-local

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: cuenora
      POSTGRES_USER: cuenora
      POSTGRES_PASSWORD: ${CUENORA_POSTGRES_PASSWORD:?Set CUENORA_POSTGRES_PASSWORD for local development}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${CUENORA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
