[package]
name = "cuenora-api"
default-run = "cuenora-api"
description = "API binary for Cuenora"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10.4", default-features = false, features = ["std"] }
cuenora-domain = { path = "../domain" }
argon2 = { version = "0.5.3", features = ["std"] }
idna = "1.1"
sha2 = "0.10"
passwords = { version = "3.1.19", default-features = false, features = ["common-password"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
