name: Docker alpha

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/docker-alpha.yml
      - infra/Dockerfile.api
      - .dockerignore
      - backend/**
      - contracts/**
      - tests/infrastructure/test_api_docker.py
      - tests/infrastructure/test_docker_alpha_workflow.py

permissions:
  contents: read

concurrency:
  group: docker-alpha-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate repository
        run: |
          python3 scripts/check_repository.py
          python3 tests/infrastructure/test_docker_alpha_workflow.py

      - name: Build and exercise native runtime
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --file infra/Dockerfile.api --tag "cuenora-alpha:${ARCH}" \
            --label "org.opencontainers.image.source=https://github.com/cuenora/cuenora" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=0.1.0-alpha.${GITHUB_RUN_NUMBER}" .
          python3 - <<'PYTHON'
          import os, runpy, uuid
          checks = runpy.run_path('tests/infrastructure/test_api_docker.py')
          image = 'cuenora-alpha:' + os.environ['ARCH']
          docker = checks['docker']
          assert docker('image', 'inspect', '--format', '{{.Architecture}}', image).stdout.strip() == os.environ['ARCH']
          assert docker('image', 'inspect', '--format', '{{.Config.User}}', image).stdout.strip() == '65532:65532'
          names = ['alpha-check-' + uuid.uuid4().hex for _ in range(3)]
          try:
              checks['check_recurrence_job_cli'](image)
              checks['check_default_loopback_bind'](image, names[0])
              checks['check_overridden_bind_and_environment'](image, names[1])
              checks['check_openapi_url'](image, None, 'http://127.0.0.1:3000')
              checks['check_openapi_url'](image, 'https://api.example.test', 'https://api.example.test')
              checks['check_invalid_openapi_urls'](image)
              checks['check_invalid_setting_does_not_log_values'](image, names[2])
          finally:
              for name in names:
                  docker('rm', '--force', name, check=False)
          print('Native image runtime checks passed')
          PYTHON

      - name: Export the exact tested image
        env:
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/images"
          docker save --output "$RUNNER_TEMP/images/${ARCH}.tar" "cuenora-alpha:${ARCH}"

      - name: Retain the native image for publication
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/images/${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish tested multi-platform alpha
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: docker.io/carfdev/cuenora
      VERSION: 0.1.0-alpha.${{ github.run_number }}
    steps:
      - name: Download this run's tested images
        uses: actions/download-artifact@v8
        with:
          pattern: image-${{ github.run_attempt }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push architecture images and assemble manifest
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          refs=()
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/images/${arch}.tar"
            image="cuenora-alpha:${arch}"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$arch"
            remote="${IMAGE}:build-${RUN_ID}-${RUN_ATTEMPT}-${arch}"
            docker tag "$image" "$remote"
            docker push "$remote"
            ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$remote")
            [[ "$ref" == *@sha256:* ]]
            refs+=("$ref")
          done
          docker manifest create "${IMAGE}:${VERSION}" "${refs[@]}"
          docker manifest push "${IMAGE}:${VERSION}"
          docker manifest inspect "${IMAGE}:${VERSION}" > "$RUNNER_TEMP/manifest.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'manifest.json').read_text())
          platforms = [(m['platform']['os'], m['platform']['architecture']) for m in data['manifests']]
          assert sorted(platforms) == [('linux', 'amd64'), ('linux', 'arm64')], platforms
          PY
          {
            echo "## Published alpha"
            echo "Image: ${IMAGE}:${VERSION}"
            echo "Source commit: ${GITHUB_SHA}"
            echo 'Platforms: linux/amd64, linux/arm64'
            echo 'Testing only. No production deployment or database migration was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
