name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository / Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check repository file conventions
        run: python3 scripts/check_repository.py

      - name: Test mobile report validation
        run: python3 tests/infrastructure/test_mobile_test_results.py -v

      - name: Test mobile tool bootstrap
        run: python3 tests/infrastructure/test_mobile_bootstrap.py -v

  shared-mobile:
    name: Shared / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android host
            runner: ubuntu-24.04
            task: testAndroidHostTest
          - target: iOS simulator
            runner: macos-26
            task: iosSimulatorArm64Test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select runner-provided Java 25
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) java_home="${JAVA_HOME_25_X64:-}" ;;
            ARM64) java_home="${JAVA_HOME_25_arm64:-}" ;;
            *) echo "Unsupported runner architecture for Java 25" >&2; exit 1 ;;
          esac
          if [[ -z "$java_home" || ! -x "$java_home/bin/java" ]]; then
            echo "Runner Java 25 is missing; check the pinned runner image inventory" >&2
            exit 1
          fi
          major=$("$java_home/bin/java" -XshowSettings:properties -version 2>&1 |
            sed -n 's/^[[:space:]]*java.specification.version = //p')
          if [[ "$major" != 25 ]]; then
            echo "Runner Java has the wrong major version; Java 25 is required" >&2
            exit 1
          fi
          printf 'JAVA_HOME=%s\n' "$java_home" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$java_home" >> "$GITHUB_PATH"
          "$java_home/bin/java" -version

      - name: Set up Gradle wrapper and dependency cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "platforms;android-37.0" \
            "build-tools;36.0.0" "build-tools;37.0.0"

      - name: Select compatible Xcode on Apple Silicon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          developer_dir=/Applications/Xcode_26.4.1.app/Contents/Developer
          test -d "$developer_dir"
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$developer_dir" xcodebuild -version
          DEVELOPER_DIR="$developer_dir" xcrun simctl list devices available

      - name: Run shared target tests
        working-directory: mobile
        env:
          TEST_TASK: ${{ matrix.task }}
        run: ./gradlew --no-daemon --console=plain ":shared:$TEST_TASK"

      - name: Diagnose failed mobile bootstrap network
        if: failure()
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import socket
          for host in ("services.gradle.org", "downloads.gradle.org"):
              try:
                  addresses = sorted({item[4][0] for item in socket.getaddrinfo(host, 443)})
                  print(f"DNS {host}: {addresses}")
              except OSError as error:
                  print(f"DNS {host}: {type(error).__name__}")
          PYTHON
          for host in services.gradle.org downloads.gradle.org; do
            for family in 4 6; do
              echo "HEAD host=$host IPv$family"
              curl "-$family" --head --location --silent --show-error \
                --connect-timeout 5 --max-time 15 --output /dev/null \
                --write-out 'http=%{http_code} peer=%{remote_ip} redirects=%{num_redirects}\n' \
                "https://$host/distributions/gradle-9.5.0-bin.zip" || true
            done
          done

      - name: Require executed and passing tests
        if: always()
        env:
          TEST_TASK: ${{ matrix.task }}
        run: python3 scripts/check_mobile_test_results.py "mobile/shared/build/test-results/$TEST_TASK"

      - name: Retain target test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shared-${{ matrix.task }}-reports
          path: |
            mobile/shared/build/test-results/${{ matrix.task }}/
            mobile/shared/build/reports/tests/${{ matrix.task }}/
          if-no-files-found: error
          retention-days: 7


  backend:
    name: Backend / Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Show Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run Rust workspace checks
        shell: bash
        run: |
          set -euo pipefail

          cd backend
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features --locked

      - name: Check isolated PostgreSQL migrations
        run: python3 -u tests/infrastructure/test_postgres_compose.py

  audit:
    name: Backend / Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned RustSec audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features

      - name: Audit locked Rust dependencies
        run: cargo audit --file Cargo.lock --deny warnings
